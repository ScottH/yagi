<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yagi Designer</title>
  <meta name="description" content="Design and analyse Yagi-Uda antennas in the browser.">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>📡 Yagi Designer</h1>
      <p class="sub">Design a Yagi-Uda antenna for any frequency.</p>
    </header>

    <section>
      <h2>1 · Parameters</h2>
      <div class="row">
        <label>Frequency <input type="number" id="freq" value="144.2" min="1" step="any"> MHz</label>
      </div>
      <div class="row">
        <label>Elements <input type="number" id="count" value="6" min="2" max="40" step="1"></label>
        <label>Ø <input type="number" id="dia" value="6" min="0.1" step="any"> mm</label>
      </div>
      <button id="generate" class="primary">Generate design</button>
    </section>

    <section>
      <h2>2 · Elements</h2>
      <p class="hint">Positions along the boom from the driven element, in mm. Edit to tweak.</p>
      <table id="elements" class="elements">
        <thead><tr><th></th><th>Position</th><th>Length</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>3 · Performance</h2>
      <dl id="summary" class="readout"></dl>
    </section>
  </aside>

  <main id="view">
    <svg id="layout" role="img" aria-label="Top view of the antenna"></svg>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
